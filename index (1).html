}
function chalLink(){const z=G.pz,o={p:{c:z.c,p:z.p,d:z.d,show:z.show,pre:z.pre,side:z.side,gen:z.gen,h:z.h},hs:G.tier==="hosp"?1:0,tier:G.tier,time:G.res.el,score:G.res.pts};return location.origin+location.pathname+"#c="+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
const chalText=()=>(G.chal?`WordMash result: me ${G.res.el}s vs you ${G.chal.time}s. `:"")+`I solved a WordMash puzzle in ${G.res.el}s (+${G.res.pts} pts). Can you beat me? ${chalLink()}`;
function wa(){window.open("https://wa.me/?text="+encodeURIComponent(chalText()),"_blank")}
function ch(){const t=chalText();if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Challenge link copied!"),()=>toast("Copy failed"));else toast("Sharing isn’t supported here")}
let CH=null;
function openChal(){const m=location.hash.match(/^#c=(.+)$/);if(!m)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1])))),q=o.p,cl=x=>String(x).replace(/[<>&"'`]/g,""),a=x=>x.map(cl);
  if(!T[o.tier]||!Array.isArray(q.p)||!Array.isArray(q.d)||!Array.isArray(q.show))return;
  o.p={c:cl(q.c),p:a(q.p),d:a(q.d),show:a(q.show),pre:cl(q.pre||""),side:q.side==="r"?"r":"l",gen:q.gen?1:0,h:cl(q.h||""),k:o.hs?HP:MP};o.time=+o.time||0;o.score=+o.score||0;CH=o;history.replaceState(null,"",location.pathname);
  modal(`<div class="pop"><div class="big">⚔️</div><h2>A friend challenged you!</h2><p>Beat <b>${o.time}s</b> and <b>${o.score}</b> pts.</p><button class="btn go" data-a="cs">Accept challenge</button></div>`)}catch(e){}}
function fail(){CB=0;modal(`<div class="pop bad"><div class="big">🤡</div><h2>${rnd(FM)}</h2><p>Combo reset. Shake it off!</p><button class="btn go" data-a="retry">Try again</button>${S.hp>0?`<button class="btn sec" data-a="hr">💡 Retry with a hint (${S.hp})</button>`:""}<button class="btn sec" data-a="reveal">Reveal the answer</button></div>`)}
function reveal(){modal(`<div class="pop"><div class="big">👀</div><h2>It was…</h2><div class="ans">${ansTxt()}</div><button class="btn go" data-a="skip">${G.daily?"Back home":"Next puzzle"}</button><button class="btn sec" data-a="retry">Try again</button></div>`)}
function next(){closeM();G.chal=0;if(G.daily)return home();save();$("game").style.opacity=0;setTimeout(()=>{newPz();$("game").style.opacity=1},200)}
function retry(){closeM();G.t0=Date.now();const t=G.tiles;G.sel=[];G.lives=3;G.lock=0;G.hints=0;G.gone=0;G.first=0;G.tiles=t.sort(()=>Math.random()-.5);render()}
function share(){
  const t=`I just solved a ${TI[G.tier][0]} puzzle on Word Mash 🔥 Streak: ${S.streak} · Score: ${S.score}. Can you beat me?`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Result copied!"),()=>toast(t));
  else toast(t);
}
/* ---- events ---- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(S.mus&&!mus)music(1);
  if(a!=="pick"&&a!=="un")sfx.click();
  ({play,daily:()=>start(0,1),tier:()=>{const t=b.dataset.t;if(t!=="hosp"&&!unlocked(t))return toast("🔒 Solve 8 "+TI[TIERS[TIERS.indexOf(t)-1]][0]+" puzzles to unlock");start(t)},pick:()=>pick(+b.dataset.id),un:()=>unpick(+b.dataset.k),hint,next:()=>next(),skip:()=>next(1),retry,reveal,rep:retry,hr:()=>{retry();hint()},wa,ch,cs:()=>{closeM();G={fix:CH.tier,daily:0,chal:CH,tier:CH.tier,pz:CH.p};load()},
  mus:()=>{S.mus=S.mus?0:1;music(S.mus);icons();save()},snd:()=>{S.snd=S.snd?0:1;$("sb").textContent=S.snd?"🔊":"🔇";save()},
  pause:()=>modal(`<div class="pop"><div class="big">⏸</div><h2>Paused</h2><button class="btn go" data-a="resume">Resume</button><button class="btn sec" data-a="home">Back to home</button></div>`),
  resume:closeM,home:()=>{closeM();home()}})[a]();
});
setInterval(()=>{const e=$("cd");if(e){const s=Math.max(0,Math.floor(((day()+1)*864e5-Date.now())/1e3));e.textContent=[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,"0")).join(":")}},1000);
home();openChal();
</script>
</body>
